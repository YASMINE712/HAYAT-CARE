<!DOCTYPE html>
<html lang="en">
<head>
{% include 'security.html' %}
  <meta charset="UTF-8">
  <title>🧠 Pattern Memory Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .color-box {
      width: 100px;
      height: 100px;
      border-radius: 10px;
      opacity: 0.6;
      cursor: pointer;
      border: 3px solid #333;
      transition: all 0.3s ease;
    }
    .color-box.active {
      opacity: 1;
      transform: scale(1.1);
      box-shadow: 0 0 20px rgba(255,255,255,0.8);
    }
    .color-box.correct {
      border-color: #10B981;
    }
    .color-box.incorrect {
      border-color: #EF4444;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    .pulse {
      animation: pulse 1.5s infinite;
    }
    #next-btn {
      display: none;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-6">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">🧠 Pattern Memory Game</h2>
    <p class="text-gray-600 text-center mb-6">Repeat the flashing color pattern. Each round gets harder.</p>

    <div class="flex justify-center gap-4 mb-8">
      <div class="color-box" id="red" style="background-color: #EF4444;" onclick="boxClicked('red')"></div>
      <div class="color-box" id="green" style="background-color: #10B981;" onclick="boxClicked('green')"></div>
      <div class="color-box" id="blue" style="background-color: #3B82F6;" onclick="boxClicked('blue')"></div>
      <div class="color-box" id="yellow" style="background-color: #F59E0B;" onclick="boxClicked('yellow')"></div>
    </div>

    <div class="flex justify-between items-center mb-6">
      <div class="bg-blue-100 text-blue-800 px-4 py-2 rounded-lg">
        <span class="font-medium">Round:</span> <span id="round-counter">1</span>/5
      </div>
      <div class="bg-green-100 text-green-800 px-4 py-2 rounded-lg">
        <span class="font-medium">Score:</span> <span id="score-display">0</span>
      </div>
      <div class="bg-purple-100 text-purple-800 px-4 py-2 rounded-lg">
        <span class="font-medium">Attempts:</span> <span id="attempts-display">0</span>
      </div>
    </div>

    <div class="flex justify-center mt-4">
      <a id="next-btn" href="{{ url_for('stroop_game') }}" 
         class="bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded-lg transition">
        Next: Stroop Game ➔
      </a>
    </div>

    <a id="next-game-btn"
       href="{{ url_for('count_game') }}"
       class="mt-6 inline-block bg-indigo-600 text-white font-semibold py-2 px-6 rounded-lg shadow hover:bg-indigo-700 transition hidden">
      Next Game <i class="fas fa-arrow-right ml-2"></i>
    </a>
  </div>

  <!-- Hidden form for ML data submission -->
  <form id="ml-data" method="POST" action="/games/drag_shapes/submit" style="display:none;">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="score" id="ml-score">
    <input type="hidden" name="attempts" id="ml-attempts">
    <input type="hidden" name="duration" id="ml-duration">
    <input type="hidden" name="accuracy" id="ml-accuracy">
  </form>

  <script>
    // Game configuration
    const colors = ['red', 'green', 'blue', 'yellow'];
    let pattern = [];
    let userInput = [];
    let round = 0;
    let score = 0;
    let attempts = 0;
    let correctAnswers = 0;
    const maxRounds = 5;
    let gameStartTime;
    let gameActive = false;
    let gameCompleted = false;

    // DOM elements
    const roundCounter = document.getElementById('round-counter');
    const scoreDisplay = document.getElementById('score-display');
    const attemptsDisplay = document.getElementById('attempts-display');
    const nextBtn = document.getElementById('next-btn');

    // Initialize game
    function startGame() {
      pattern = [];
      userInput = [];
      round = 0;
      score = 0;
      attempts = 0;
      correctAnswers = 0;
      gameCompleted = false;
      gameStartTime = Date.now();
      
      updateDisplays();
      nextBtn.style.display = 'none';
      nextRound();
    }

    function updateDisplays() {
      roundCounter.textContent = `${round}/${maxRounds}`;
      scoreDisplay.textContent = score;
      attemptsDisplay.textContent = attempts;
    }

    function flash(boxId) {
      const box = document.getElementById(boxId);
      box.classList.add('active');
      setTimeout(() => box.classList.remove('active'), 500);
    }

    function playPattern() {
      userInput = [];
      let i = 0;
      const interval = setInterval(() => {
        flash(pattern[i]);
        i++;
        if (i >= pattern.length) {
          clearInterval(interval);
          gameActive = true;
        }
      }, 800);
    }

    function nextRound() {
      if (round >= maxRounds) {
        endGame();
        return;
      }
      
      round++;
      gameActive = false;
      updateDisplays();
      
      // Add new color to pattern
      pattern.push(colors[Math.floor(Math.random() * colors.length)]);
      
      setTimeout(playPattern, 1000);
    }

    function boxClicked(color) {
      if (!gameActive || gameCompleted) return;
      
      // Visual feedback
      const box = document.getElementById(color);
      box.classList.add('active');
      setTimeout(() => box.classList.remove('active'), 200);
      
      // Track attempt
      attempts++;
      userInput.push(color);
      updateDisplays();
      
      // Check if correct
      const isCorrect = color === pattern[userInput.length - 1];
      
      // Visual feedback
      box.classList.add(isCorrect ? 'correct' : 'incorrect');
      setTimeout(() => box.classList.remove('correct', 'incorrect'), 500);
      
      if (isCorrect) {
        correctAnswers++;
        
        // Check if pattern complete
        if (userInput.length === pattern.length) {
          score++;
          updateDisplays();
          gameActive = false;
          setTimeout(nextRound, 1500);
        }
      } else {
        // Wrong answer - end game
        setTimeout(endGame, 1000);
      }
    }

    function endGame() {
      gameActive = false;
      gameCompleted = true;
      
      // Calculate metrics for ML model
      const duration = Math.round((Date.now() - gameStartTime) / 1000);
      const accuracy = attempts > 0 ? (correctAnswers / attempts) : 0;
      
      // Prepare data for ML model
      document.getElementById('ml-score').value = score;
      document.getElementById('ml-attempts').value = attempts;
      document.getElementById('ml-duration').value = duration;
      document.getElementById('ml-accuracy').value = accuracy.toFixed(2);
      
      // Submit data to ML model
      document.getElementById('ml-data').submit();
      
      // Show next button
      nextBtn.style.display = 'block';
      document.getElementById('next-game-btn').classList.remove('hidden');
    }

    // Start the game when page loads
    startGame();
  </script>
</body>
</html>
