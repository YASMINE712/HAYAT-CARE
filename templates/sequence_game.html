<!DOCTYPE html>
<html lang="en">
<head>
{% include 'security.html' %}
  <meta charset="UTF-8">
  <title>🧠 Pattern Memory Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .color-box {
      width: 100px;
      height: 100px;
      border-radius: 10px;
      opacity: 0.6;
      cursor: pointer;
      border: 3px solid #333;
      transition: all 0.3s ease;
    }
    .color-box.active {
      opacity: 1;
      transform: scale(1.1);
      box-shadow: 0 0 20px rgba(255,255,255,0.8);
    }
    .color-box.correct {
      border-color: #10B981;
    }
    .color-box.incorrect {
      border-color: #EF4444;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    .pulse {
      animation: pulse 1.5s infinite;
    }
    #next-btn {
      display: none;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-6">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">🧠 Pattern Memory Game</h2>
    <p class="text-gray-600 text-center mb-6">Repeat the flashing color pattern. Each round gets harder.</p>

    <div class="flex justify-center gap-4 mb-8">
      <div class="color-box" id="red" style="background-color: #EF4444;" onclick="boxClicked('red')"></div>
      <div class="color-box" id="green" style="background-color: #10B981;" onclick="boxClicked('green')"></div>
      <div class="color-box" id="blue" style="background-color: #3B82F6;" onclick="boxClicked('blue')"></div>
      <div class="color-box" id="yellow" style="background-color: #F59E0B;" onclick="boxClicked('yellow')"></div>
    </div>

    <div class="flex justify-between items-center mb-6">
      <div class="bg-blue-100 text-blue-800 px-4 py-2 rounded-lg">
        <span class="font-medium">Round:</span> <span id="round-counter">1</span>/5
      </div>
      <div class="bg-green-100 text-green-800 px-4 py-2 rounded-lg">
        <span class="font-medium">Score:</span> <span id="score-display">0</span>
      </div>
      <div class="bg-purple-100 text-purple-800 px-4 py-2 rounded-lg">
        <span class="font-medium">Attempts:</span> <span id="attempts-display">0</span>
      </div>
    </div>

    <div class="flex justify-center mt-4">
      <button id="next-btn" 
              class="bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded-lg transition">
        Next ➔
      </button>
    </div>

    <a id="next-game-btn"
       href="{{ url_for('cognitive_quiz') }}"
       class="mt-6 inline-block bg-indigo-600 text-white font-semibold py-2 px-6 rounded-lg shadow hover:bg-indigo-700 transition hidden">
      Next: Cognitive Quiz <i class="fas fa-arrow-right ml-2"></i>
    </a>
  </div>

  <form id="game-results" method="POST" action="/games/drag_shapes/submit" style="display: none;">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="score" id="form-score">
    <input type="hidden" name="attempts" id="form-attempts">
    <input type="hidden" name="duration" id="form-duration">
    <input type="hidden" name="accuracy" id="form-accuracy">
  </form>

  <script>
    const colors = ['red', 'green', 'blue', 'yellow'];
    let pattern = [];
    let userInput = [];
    let round = 0;
    let score = 0;
    let attempts = 0;
    let correctAnswers = 0;
    const maxRounds = 5;
    let startTime;
    let gameActive = false;
    let gameCompleted = false;

    // DOM elements
    const roundCounter = document.getElementById('round-counter');
    const scoreDisplay = document.getElementById('score-display');
    const attemptsDisplay = document.getElementById('attempts-display');
    const nextBtn = document.getElementById('next-btn');
    const nextGameBtn = document.getElementById('next-game-btn');
    const resultsForm = document.getElementById('game-results');

    function flash(boxId) {
      const box = document.getElementById(boxId);
      box.classList.add('active');
      setTimeout(() => {
        box.classList.remove('active');
      }, 500);
    }

    function playPattern() {
      userInput = [];
      let i = 0;
      const interval = setInterval(() => {
        flash(pattern[i]);
        i++;
        if (i >= pattern.length) {
          clearInterval(interval);
          gameActive = true;
        }
      }, 800);
    }

    function nextRound() {
      if (round >= maxRounds) {
        return endGame();
      }
      round++;
      roundCounter.textContent = `${round}/${maxRounds}`;
      gameActive = false;
      
      const nextColor = colors[Math.floor(Math.random() * colors.length)];
      pattern.push(nextColor);
      setTimeout(playPattern, 1000);
    }

    function boxClicked(color) {
      if (!gameActive || userInput.length >= pattern.length || gameCompleted) return;
      
      const box = document.getElementById(color);
      box.classList.add('active');
      setTimeout(() => box.classList.remove('active'), 200);
      
      userInput.push(color);
      attempts++;
      attemptsDisplay.textContent = attempts;
      
      // Visual feedback
      if (color === pattern[userInput.length - 1]) {
        box.classList.add('correct');
        setTimeout(() => box.classList.remove('correct'), 500);
      } else {
        box.classList.add('incorrect');
        setTimeout(() => box.classList.remove('incorrect'), 500);
      }

      // Check correctness
      if (color !== pattern[userInput.length - 1]) {
        setTimeout(() => endGame(), 1000);
        return;
      }

      if (userInput.length === pattern.length) {
        score++;
        correctAnswers++;
        scoreDisplay.textContent = score;
        gameActive = false;
        setTimeout(nextRound, 1500);
      }
    }

    function endGame() {
      gameActive = false;
      gameCompleted = true;
      
      // Calculate metrics for ML model
      const duration = Math.round((Date.now() - startTime) / 1000);
      const accuracy = attempts > 0 ? (correctAnswers / attempts) : 0;
      
      // Set form values
      document.getElementById('form-score').value = score;
      document.getElementById('form-attempts').value = attempts;
      document.getElementById('form-duration').value = duration;
      document.getElementById('form-accuracy').value = accuracy.toFixed(2);
      
      // Show next button
      nextBtn.style.display = 'block';
      nextBtn.onclick = function(event) {
        event.preventDefault();
        // Submit results to your ML model endpoint
        resultsForm.submit();
        
        // The server redirects to the questionnaire after saving the result.
      };

      // Show next game link
      document.getElementById('next-game-btn').classList.remove('hidden');
    }

    // Initialize game
    function startGame() {
      pattern = [];
      userInput = [];
      round = 0;
      score = 0;
      attempts = 0;
      correctAnswers = 0;
      gameCompleted = false;
      startTime = Date.now();
      scoreDisplay.textContent = '0';
      attemptsDisplay.textContent = '0';
      roundCounter.textContent = '1/5';
      
      // Hide next button and game link initially
      nextBtn.style.display = 'none';
      nextGameBtn.classList.add('hidden');
      
      nextRound();
    }

    // Start the game when page loads
    startGame();
  </script>
</body>
</html>
